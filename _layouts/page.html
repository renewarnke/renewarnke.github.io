<!DOCTYPE html>
<html lang="{{ site.lang | default: 'de' }}">
{% include head.html %}

<body>
  <header class="site-header is-scrolled" id="top" data-nav>
    <div class="container site-header__inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Hauptnavigation">
        <ul>
          <li><a href="{{ '/' | relative_url }}">Startseite</a></li>
          <li><a href="{{ '/#it-check' | relative_url }}">IT-Check</a></li>
          <li><a href="{{ '/#contact' | relative_url }}">Kontakt</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container container--narrow legal">
        <h1 class="legal__title">{{ page.title }}</h1>
        {{ content }}
      </div>
    </section>
  </main>

  {% include footer.html %}
  {% include scripts.html %}
</body>

</html>
