<section class="section section--alt" id="contact">
  <div class="container container--narrow">
    <div class="section__head">
      <h2 class="section__title">Kontakt</h2>
      <p class="section__lead">Erzählen Sie mir kurz von Ihrem Vorhaben — ich melde mich zeitnah zurück.</p>
    </div>

    <form class="form" action="https://formspree.io/f/{{ site.formspree_id }}" method="POST" data-contact-form novalidate>
      <div class="form__row">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" placeholder="Ihr Name" required>
      </div>

      <div class="form__row">
        <label for="email">E-Mail-Adresse</label>
        <input type="email" name="email" id="email" placeholder="name@firma.de" required>
      </div>

      <div class="form__row">
        <label for="message">Nachricht</label>
        <textarea name="message" id="message" rows="5" placeholder="Worum geht es?" required></textarea>
      </div>

      <input type="hidden" name="_subject" value="Neue Anfrage über renewarnke.de">
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" class="form__honeypot">

      <button type="submit" class="btn btn--primary">Nachricht senden</button>
      <p class="form__status" data-form-status role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
