<section class="section section--alt" id="contact">
  <div class="container container--narrow">
    <div class="section__head">
      <h2 class="section__title">Kontakt</h2>
      <p class="section__lead">Erzählen Sie mir kurz, was Sie beschäftigt — ob konkretes Problem oder einfach ein mulmiges Gefühl bei Ihrer IT. Ich melde mich zeitnah bei Ihnen.</p>
    </div>

    <div class="form" data-contact-form>
      <div class="form__iframe-wrapper">
        <iframe
          src="{{ site.nextcloud_forms_embed_url }}"
          width="750"
          height="900"
          loading="lazy"
          allow="clipboard-write"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
          title="Kontaktformular"
          data-contact-iframe
        ></iframe>
        <noscript>
          <p>Bitte aktivieren Sie JavaScript, um das Kontaktformular zu nutzen.</p>
        </noscript>
      </div>
    </div>
  </div>
</section>
