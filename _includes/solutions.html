<section class="section section--alt" id="solutions">
  <div class="container">
    <div class="section__head">
      <h2 class="section__title">Lösungen, mit denen ich arbeite</h2>
      <p class="section__lead">Bewährte Werkzeuge — europäisch, offen und dort, wo es passt, auch Public Cloud.</p>
    </div>

    <ul class="chips">
      {% for tool in site.data.solutions %}
      <li class="chip">
        <span class="chip__name">{{ tool.name }}</span>
        <span class="chip__detail">{{ tool.detail }}</span>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
