<section class="section section--alt" id="solutions">
  <div class="container">
    <div class="section__head">
      <h2 class="section__title">Womit ich arbeite</h2>
      <p class="section__lead">Bewährte, verständliche Werkzeuge — bevorzugt lokal, offen und europäisch, und dort wo es sinnvoll ist auch etablierte Cloud-Dienste.</p>
    </div>

    <ul class="chips">
      {% for tool in site.data.solutions %}
      <li class="chip">
        <span class="chip__name">{{ tool.name }}</span>
        <span class="chip__detail">{{ tool.detail }}</span>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
