# Leistungen / services — icon: infrastruktur | workplace | strategie
- icon: infrastruktur
  title: Infrastruktur
  description: >-
    Eine solide IT-Infrastruktur muss nicht von den großen Hyperscalern kommen.
    Ich helfe Ihnen, eine Umgebung aufzubauen, die zu Ihrem Unternehmen passt —
    mit europäischen Cloud-Anbietern, durchdachter Architektur und voller
    Kontrolle über Ihre Daten. Von Hosting über Netzwerk bis Security.

- icon: workplace
  title: Workplace
  description: >-
    Ein digitaler Arbeitsplatz sollte zu Ihrem Team passen — nicht umgekehrt.
    Ich helfe Ihnen, die richtigen Werkzeuge für Ihren Arbeitsalltag zu finden
    und einzuführen: ob Nextcloud, Collabora, eigene Mail-Lösung oder andere
    hochwertige Alternativen. Produktiv, DSGVO-konform und bezahlbar.

- icon: strategie
  title: Strategie & Beratung
  description: >-
    Wo stehen Sie heute und wo wollen Sie hin? Gemeinsam analysieren wir Ihre
    aktuelle IT-Landschaft und entwickeln eine Strategie, die zu Ihrem
    Unternehmen passt. Von der ersten Bestandsaufnahme bis zur
    Umsetzungsbegleitung — pragmatisch, auf Augenhöhe und ohne unnötige
    Komplexität.
