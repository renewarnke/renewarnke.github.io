# Leistungen / services — icon: infrastruktur | workplace | strategie
- icon: infrastruktur
  title: Backup & Schutz vor Datenverlust
  description: >-
    Was passiert, wenn morgen die Festplatte streikt oder ein
    Verschlüsselungs-Trojaner zuschlägt? Ich richte ein Backup ein, das
    wirklich läuft — und getestet ist. Damit Angebote, Rechnungen und
    Kundendaten im Ernstfall zuverlässig zurückkommen und Sie nachts
    ruhig schlafen können.

- icon: workplace
  title: Sicher im Alltag — Passwörter, E-Mail & Datenschutz
  description: >-
    Unübersichtliche Passwörter, verdächtige E-Mails, Unsicherheit bei der
    DSGVO? Ich bringe Ordnung rein: eine einfache Passwortverwaltung, Schutz
    vor Phishing und einen ehrlichen, verständlichen Blick darauf, was Sie bei
    Kunden- und Mitarbeiterdaten beachten müssen.

- icon: strategie
  title: Passende Technik & echte Unabhängigkeit
  description: >-
    Veraltete Rechner, Software die nicht mehr passt oder der Wunsch, nicht von
    großen US-Cloud-Konzernen abhängig zu sein? Wir schauen gemeinsam, was Ihr
    Betrieb wirklich braucht — mit lokalen und offenen Lösungen, wo es sinnvoll
    ist, und ohne teures Rundum-sorglos-Paket.
