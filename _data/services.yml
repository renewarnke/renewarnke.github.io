# Leistungen / services — icon: sicherheit | workplace | infrastruktur | strategie
- icon: sicherheit
  title: IT-Grundlagen & Sicherheit
  description: >-
    Das Fundament, auf das Sie sich verlassen können: ein getestetes Backup
    gegen Datenverlust, eine übersichtliche Passwortverwaltung und ein
    ehrlicher, verständlicher Blick auf den Datenschutz (DSGVO). Damit
    Kundendaten, Rechnungen und Angebote sicher sind — und Sie im Ernstfall
    ruhig bleiben.

- icon: workplace
  title: Digitalisierung von Arbeitsabläufen
  description: >-
    Papierkram und wiederkehrende Handgriffe kosten Zeit. Gemeinsam schauen
    wir, welche Abläufe sich sinnvoll digitalisieren lassen — und wo moderne
    KI-Werkzeuge wirklich helfen, etwa beim Schreiben von Texten oder beim
    Diktieren statt Tippen. Pragmatisch und ohne Technik-Overkill.

- icon: infrastruktur
  title: Souveräne IT-Infrastruktur
  description: >-
    Unabhängigkeit von großen Cloud-Konzernen: Ich setze auf lokale und offene
    Open-Source-Lösungen, die Sie selbst in der Hand behalten. Wo es sinnvoll
    ist, laufen sogar KI-Werkzeuge direkt bei Ihnen im Betrieb statt in einer
    fremden Cloud — für volle Kontrolle über Ihre Daten.
